# Configuración Nginx para Objetiva Sync Gateway
# Subdominio: sync-gateway.sanchezrepuestos.com.ar
# Puerto interno: 3335

# Redirige HTTP a HTTPS
server {
    listen 80;
    server_name sync-gateway.sanchezrepuestos.com.ar;

    # Necesario para Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://sync-gateway.sanchezrepuestos.com.ar$request_uri;
    }
}

# Servidor Sync Gateway en HTTPS
server {
    listen 443 ssl;
    server_name sync-gateway.sanchezrepuestos.com.ar;

    # Certificados SSL (se generarán con certbot)
    ssl_certificate /etc/letsencrypt/live/sync-gateway.sanchezrepuestos.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sync-gateway.sanchezrepuestos.com.ar/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Tamaño máximo para batch de datos
    client_max_body_size 50M;

    # Timeouts más largos para operaciones de sincronización
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    proxy_read_timeout 300;

    location / {
        proxy_pass http://127.0.0.1:3335/;
        proxy_http_version 1.1;

        # Headers necesarios
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (si se necesita en el futuro)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Logs específicos para este subdominio
    access_log /var/log/nginx/sync-gateway.access.log;
    error_log /var/log/nginx/sync-gateway.error.log;
}
