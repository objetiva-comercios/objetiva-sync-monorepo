# Configuración Nginx para Objetiva Sync Service
# Este servicio usa SSE (Server-Sent Events) para streaming de progreso de sincronización
# IMPORTANTE: SSE requiere proxy_buffering off y timeouts largos
#
# Subdominio: sync.sanchezrepuestos.com.ar (placeholder - ajustar según necesidad)
# Puerto interno: 3000 (puerto por defecto de Fastify para sync service)

# Redirige HTTP a HTTPS
server {
    listen 80;
    server_name sync.sanchezrepuestos.com.ar;

    # Necesario para Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://sync.sanchezrepuestos.com.ar$request_uri;
    }
}

# Servidor Sync Service en HTTPS
server {
    listen 443 ssl;
    server_name sync.sanchezrepuestos.com.ar;

    # Certificados SSL (se generarán con certbot)
    ssl_certificate /etc/letsencrypt/live/sync.sanchezrepuestos.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sync.sanchezrepuestos.com.ar/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Tamaño máximo para request bodies
    client_max_body_size 10M;

    # Timeouts para SSE - CRÍTICO para sync streaming
    # SSE puede tomar 10+ minutos para sincronizaciones grandes
    proxy_connect_timeout 60;
    proxy_send_timeout 600;
    proxy_read_timeout 600;

    # CRÍTICO para SSE - deshabilitar buffering
    # Sin esto, los eventos SSE no llegarán al cliente en tiempo real
    proxy_buffering off;
    proxy_cache off;

    location / {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;

        # Headers necesarios
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE requiere Connection vacío (NO "upgrade" como WebSocket)
        proxy_set_header Connection '';
    }

    # Logs específicos para este subdominio
    access_log /var/log/nginx/sync.access.log;
    error_log /var/log/nginx/sync.error.log;
}
